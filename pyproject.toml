[project]
name = "xnatcli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dcm2bids>=3",
    "dcm2niix",
    "pyxnat>=1.6",
]

[project.scripts]
xnatcli = "xnatcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xnatcli"]

[dependency-groups]
dev = [
    "nibabel>=5.4.2",
    "pandas>=3.0.2",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
