[project]
name = "xnatbidscli"
dynamic = ["version"]
description = "CLI for logging into XNAT, downloading neuroimaging experiments, and converting them to BIDS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Eric Earl", email = "eric.earl@nih.gov" },
]
maintainers = [
    { name = "NIMH Data Science and Sharing Team", email = "nimhdsst@mail.nih.gov" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# bioread and pymatreader are the readers phys2bids imports lazily for .acq and
# .mat files; it does not depend on them directly.
dependencies = [
    "bioread>=3",
    "cubids>=1.2.1",
    "dcm2bids>=3",
    "dcm2niix>=1.0.20260416",
    "nibabel>=5.4.2",
    "pandas>=2,<2.4",
    "phys2bids>=2.11",
    "pydicom>=2.4",
    "pymatreader>=1",
    "pyxnat>=1.6",
    "requests>=2",
]

[project.urls]
Homepage = "https://github.com/nimh-dsst/xnat-bids-cli"
Documentation = "https://xnatbidscli.readthedocs.io/"
Repository = "https://github.com/nimh-dsst/xnat-bids-cli"
Issues = "https://github.com/nimh-dsst/xnat-bids-cli/issues"

[project.scripts]
xnatbidscli = "xnatbidscli.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/xnatbidscli"]

[tool.hatch.build.targets.wheel.force-include]
"src/assets" = "xnatbidscli/assets"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
